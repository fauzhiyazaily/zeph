name: Ingestion Governance

on:
  pull_request:
    paths:
      - "zeph/src/**"
      - "zeph/scripts/**"
      - "zeph/supabase/migrations/**"
      - "shared/ingestion/**"
      - "zeph/package.json"
      - "zeph/vitest.config.ts"
      - "zeph/.github/workflows/ingestion-governance.yml"
  push:
    branches: [main]
    paths:
      - "zeph/src/**"
      - "zeph/scripts/**"
      - "zeph/supabase/migrations/**"
      - "shared/ingestion/**"
      - "zeph/package.json"
      - "zeph/vitest.config.ts"
      - "zeph/.github/workflows/ingestion-governance.yml"

jobs:
  ingestion-governance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zeph
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: zeph/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Governance runtime tests
        run: npm run test:governance:runtime

      - name: Governance contract tests
        run: npm run test:governance:contracts

      - name: Fingerprint collision tests
        run: npm run test:governance:fingerprint

      - name: Governance tag suite
        run: npm run test:governance

      - name: Typecheck
        run: npm run typecheck

      - name: Governance checker
        run: npm run governance:check-ingestion

  replay-suites:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zeph
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: zeph/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Replay resilience tests
        run: npx vitest run src/lib/ingestion/replay-resilience.test.ts

      - name: Reconciliation governance tests
        run: npx vitest run src/lib/ingestion/reconciliation.governance.test.ts

  deployment-gate:
    runs-on: ubuntu-latest
    needs: [ingestion-governance, replay-suites]
    defaults:
      run:
        working-directory: zeph
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: zeph/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Full governance suite (deployment pre-check)
        run: npm run test:governance

      - name: Import governance checker (deployment pre-check)
        run: npm run governance:check-ingestion

      - name: Typecheck (deployment pre-check)
        run: npm run typecheck

      - name: Governance gate passed
        run: echo "All governance and replay suites passed. Deployment is cleared."
